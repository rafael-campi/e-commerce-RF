name: CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      # mesma porta e credenciais do .env.test
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: ecommerce_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: yarn test:e2e

  # Front: Playwright no navegador contra a API real (fluxos de compra e de admin, erros 400/401/409)
  web:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: ecommerce_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: yarn test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
