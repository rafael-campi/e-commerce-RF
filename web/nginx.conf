# Só o front: /api e /psp chegam pelo api-gateway, na mesma origem.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # rotas do React Router (/produtos, /admin/financeiro...) caem no index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
